    <!-- S -->
    <path d="M240 196 C240 176 222 164 196 164 C166 164 148 180 148 202 C148 226 170 234 196 242 C222 250 244 258 244 284 C244 308 224 324 194 324 C166 324 146 310 146 288"/>
    <!-- R -->
