  <!-- App icon base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- SR monogram -->
  <g transform="translate(-6 12)" fill="none" stroke="url(#ink)" stroke-width="36"
